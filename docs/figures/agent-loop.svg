<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="590" fill="#fff"/>
  <text x="20" y="30" font-size="17" font-weight="bold">Ajan sürümü (Tür B demo): çevir – test et – düzelt döngüsü</text>

  <!-- Task -->
  <rect x="20" y="60" width="170" height="70" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="105" y="88" text-anchor="middle" font-weight="bold">Görev</text>
  <text x="105" y="108" text-anchor="middle" font-size="12">TASK.md, original.c,</text>
  <text x="105" y="122" text-anchor="middle" font-size="12">API taslağı, görünür testler</text>

  <!-- LLM -->
  <rect x="260" y="55" width="220" height="80" rx="6" fill="#dbe8f6" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="370" y="85" text-anchor="middle" font-weight="bold">LLM (Sonnet / Haiku)</text>
  <text x="370" y="105" text-anchor="middle" font-size="12">sonraki adıma ve araca</text>
  <text x="370" y="120" text-anchor="middle" font-size="12">kendisi karar verir</text>
  <line x1="190" y1="95" x2="258" y2="95" stroke="#333" marker-end="url(#a)"/>

  <!-- Permission layer -->
  <rect x="230" y="170" width="430" height="240" rx="8" fill="none" stroke="#b03a2e" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="245" y="385" font-size="12" fill="#b03a2e">İzin katmanı (Claude Code): yalnız Read/Write/Edit ve ./run_tests.sh;</text>
  <text x="245" y="400" font-size="12" fill="#b03a2e">diğer komutlar (ör. cargo test) reddedilir</text>

  <!-- Tools -->
  <rect x="250" y="225" width="180" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="340" y="250" text-anchor="middle" font-weight="bold">Dosya araçları</text>
  <text x="340" y="268" text-anchor="middle" font-size="12">Read / Write / Edit (src/lib.rs)</text>
  <rect x="460" y="225" width="180" height="60" rx="6" fill="#fff" stroke="#333"/>
  <text x="550" y="250" text-anchor="middle" font-weight="bold">./run_tests.sh</text>
  <text x="550" y="268" text-anchor="middle" font-size="12">görünür testler (en çok 10 koşu)</text>
  <line x1="340" y1="135" x2="340" y2="223" stroke="#333" marker-end="url(#a)"/>
  <line x1="420" y1="135" x2="540" y2="223" stroke="#333" marker-end="url(#a)"/>

  <!-- Decision -->
  <polygon points="550,305 625,340 550,375 475,340" fill="#fff" stroke="#333"/>
  <text x="550" y="345" text-anchor="middle" font-size="12">Geçti mi?</text>
  <line x1="550" y1="285" x2="550" y2="303" stroke="#333" marker-end="url(#a)"/>
  <!-- No: back to LLM -->
  <path d="M475,340 L200,340 L200,150 L258,120" fill="none" stroke="#333" marker-end="url(#a)"/>
  <text x="250" y="358" font-size="12">Hayır: hata çıktısı LLM'e geri döner (döngü)</text>
  <!-- Yes: report -->
  <line x1="625" y1="340" x2="718" y2="340" stroke="#333" marker-end="url(#a)"/>
  <text x="640" y="332" font-size="12">Evet</text>
  <rect x="720" y="305" width="160" height="70" rx="6" fill="#e3f1e3" stroke="#2e7d32"/>
  <text x="800" y="333" text-anchor="middle" font-weight="bold">Son rapor</text>
  <text x="800" y="352" text-anchor="middle" font-size="12">ne yapıldı, gözlenen</text>
  <text x="800" y="366" text-anchor="middle" font-size="12">test durumu, endişeler</text>

  <!-- Approval -->
  <rect x="720" y="55" width="160" height="90" rx="6" fill="#fdf0d5" stroke="#b7791f"/>
  <text x="800" y="82" text-anchor="middle" font-weight="bold">İnsan onayı</text>
  <text x="800" y="101" text-anchor="middle" font-size="12">APPROVAL_NEEDED:</text>
  <text x="800" y="116" text-anchor="middle" font-size="12">test değişikliği, unsafe,</text>
  <text x="800" y="131" text-anchor="middle" font-size="12">bağımlılık, sırlar</text>
  <line x1="480" y1="85" x2="718" y2="95" stroke="#b7791f" marker-end="url(#a)"/>
  <text x="712" y="74" text-anchor="end" font-size="12" fill="#b7791f">kural dışı istek: güvenli kısmı yap, dur</text>
  <line x1="660" y1="250" x2="718" y2="250" stroke="#333"/>
  <line x1="800" y1="250" x2="800" y2="303" stroke="#333" marker-end="url(#a)"/>
  <line x1="718" y1="250" x2="800" y2="250" stroke="#333"/>
  <text x="664" y="243" font-size="12">araç hatası: tahmin etme, raporla</text>

  <!-- Baseline -->
  <rect x="20" y="450" width="860" height="110" rx="8" fill="#f7f7f7" stroke="#999"/>
  <text x="40" y="477" font-size="15" font-weight="bold">Temel sistem (LLM uygulaması): tek çağrı, araç yok</text>
  <rect x="40" y="492" width="230" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="155" y="522" text-anchor="middle" font-size="12">Tüm dosyalar tek mesajda</text>
  <rect x="330" y="492" width="230" height="50" rx="6" fill="#dbe8f6" stroke="#1f4e79"/>
  <text x="445" y="522" text-anchor="middle" font-size="12">LLM: src/lib.rs + not satırları</text>
  <rect x="620" y="492" width="240" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="740" y="515" text-anchor="middle" font-size="12">Testler yalnız değerlendirmede</text>
  <text x="740" y="530" text-anchor="middle" font-size="12">(geri bildirim yok)</text>
  <line x1="270" y1="517" x2="328" y2="517" stroke="#333" marker-end="url(#a)"/>
  <line x1="560" y1="517" x2="618" y2="517" stroke="#333" marker-end="url(#a)"/>
</svg>
